; user_controls.cfg - fully user-remappable Dreamcast controller layout for
; NullDC4Wii.
;
; Select it from the CONTROLS menu: SPECIAL LAYOUT -> USER CFG (see
; wii/main.cpp g_special_layout_preset). While that row is set to anything
; else (OFF / CHUCHU ROCKET / DDR SELECT), this file has no effect at all.
;
; Lives next to game_presets.cfg: looked up next to boot.dol first, then the
; games folder on whichever device is active, then SD, then USB (see
; loadUserControls() in wii/main.cpp). Applies to every game and every
; player port the same way -- it is not a per-game preset like
; game_presets.cfg.
;
; ============================================================================
; FORMAT
; ============================================================================
; Two fixed sections, [Dreamcast_Wiimote] and [Dreamcast_Gamecube]. Every
; line inside a section reads
;
;     DC_TARGET=physical_source
;
; Everything is case-insensitive. A target line can repeat -- each repeat
; just ADDS another physical source that can trigger it (OR'd together),
; which is how the template below gives L two sources (Wiimote MINUS and
; Nunchuk Z both trigger the Dreamcast's L).
;
; DC targets (left of =):
;   A B X Y START   - Dreamcast face/start buttons.
;   L  (alias D)    - Dreamcast's digital left-trigger bit.
;   R  (alias C)    - Dreamcast's digital right-trigger bit.
;                     L/D and R/C are the SAME two bits either way you spell
;                     them -- "L"/"R" for players thinking in trigger terms,
;                     "D"/"C" for players thinking in real Dreamcast/arcade-
;                     stick button terms (e.g. the arcade DDR cabinet's "C"
;                     button doubles as this bit). Mix spellings freely --
;                     both just add sources to the same target.
;   Z               - Dreamcast's separate Z button (6-button arcade sticks
;                     and Naomi ports read this on top of A/B/C). Nothing
;                     reads from it by default, so most games ignore it.
;   D-PAD           - value must be D-PAD (use this section's own physical
;                     d-pad -- Classic Controller's d-pad counts as part of
;                     the Wiimote section) or undefined (disable it).
;                     Individual directions aren't remappable here -- that's
;                     what the CHUCHU ROCKET / DDR SELECT special layouts
;                     already do, each for one specific game.
;   STICK           - Wiimote section: nunchuck_stick or classic_stick
;                     (whichever expansion is actually plugged in reads the
;                     same either way -- only one can be attached at once).
;                     Gamecube section: stick. undefined disables that
;                     section's stick entirely.
;   exit_combo      - one or more sources ANDed together with the literal
;                     word "and", e.g. -and+ (Wiimote MINUS + PLUS) or
;                     RandLandZ (GameCube R + L + Z). ALL of them must be
;                     held at the same time. The Wiimote MINUS+PLUS combo
;                     always exits too, no matter what this file says, so a
;                     typo here can never lock you out of the menu.
;
; Wiimote-section physical sources:
;   a b 1 2 home minus(-) plus(+) up down left right
;   nunchuck_z nunchuck_c nunchuck_stick
;   classic_a classic_b classic_x classic_y classic_l classic_r
;   classic_zl classic_zr classic_plus classic_minus classic_home
;   classic_up classic_down classic_left classic_right classic_stick
;   undefined (also: none, off)
;
; Gamecube-section physical sources:
;   a b x y start up down left right l r z stick
;   c_stick_up c_stick_down c_stick_left c_stick_right (digital taps off the
;     C-stick -- a way to get a 6th button on a pad with none free, like the
;     real Dreamcast arcade stick's extra face buttons)
;   undefined (also: none, off)
;
; Unknown lines or tokens are logged and skipped -- they never fail a boot,
; they just don't do anything.
; ============================================================================

[Dreamcast_Wiimote]
A=A
A=classic_b        ; Classic Controller face buttons are matched by physical
B=B                ; position, not label: bottom=A, right=B, left=X, top=Y
B=classic_a        ; (same convention the CHUCHU ROCKET layout already uses)
Y=1
X=2
X=classic_y
Y=classic_x
C=nunchuck_c       ; bonus: the Nunchuk's C button does nothing otherwise
R=plus
R=classic_zr
R=classic_r
L=minus
L=nunchuck_z
L=classic_zl
L=classic_l
Z=undefined
START=home
START=classic_plus
START=classic_home
D-PAD=D-PAD
STICK=nunchuck_stick
exit_combo=-and+

[Dreamcast_Gamecube]
A=A
B=B
Y=Y
X=X
START=START
L=L
R=R
Z=undefined
; Uncomment to read any C-stick tap as an extra R/C source -- handy for
; fighting-game / arcade-stick conversions:
;C=c_stick_up
;C=c_stick_down
;C=c_stick_left
;C=c_stick_right
D-PAD=D-PAD
STICK=stick
exit_combo=randlandz
